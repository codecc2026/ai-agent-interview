<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AI Agent 面试题专辑</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.css" />
  <style>
    :root {
      --theme-color: #00c853;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    (function () {
      var config = {
        name: "AI Agent 面试题专辑",
        nameLink: "#/",
        repo: "https://github.com/codecc2026/ai-agent-interview",
        loadSidebar: true,
        loadNavbar: false,
        coverpage: false,
        homepage: "README.md",
        subMaxLevel: 3,
        auto2top: true,
        search: {
          paths: "auto",
          placeholder: "搜索文章",
          noData: "未找到结果",
          depth: 4
        },
        pagination: {
          previousText: "上一篇",
          nextText: "下一篇",
          crossChapter: true,
          crossChapterText: true
        },
        copyCode: {
          buttonText: "复制",
          errorText: "复制失败",
          successText: "已复制"
        }
      };
      if (/github\.io$/i.test(location.hostname)) {
        config.basePath = "/ai-agent-interview/";
      }
      window.$docsify = config;
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
</body>
</html>
